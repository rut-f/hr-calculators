<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון דמי הבראה</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .calculator-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 118, 110, 0.15);
            padding: 25px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            border: 1px solid #ccfbf1;
        }
        h2 {
            color: #0f766e; /* ירוק טורקיז כהה */
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #115e59;
            font-size: 15px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #99f6e4; /* טורקיז בהיר */
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #f0fdfa;
            color: #115e59;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #0d9488; /* טורקיז מודגש בפוקוס */
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1);
        }
        .percent-symbol {
            position: absolute;
            left: 12px;
            color: #0d9488;
            font-weight: bold;
            font-size: 16px;
        }
        #jobPercentage {
            padding-left: 30px;
        }
        .result-box {
            background-color: #f0fdfa; /* רקע טורקיז עדין מאוד */
            border-right: 5px solid #0d9488;
            padding: 18px;
            border-radius: 8px;
            margin-top: 25px;
            animation: fadeIn 0.4s ease;
            display: none;
        }
        .result-line {
            margin-bottom: 10px;
            font-size: 16px;
            color: #115e59;
        }
        .result-line:last-child {
            margin-bottom: 0;
        }
        .result-line strong {
            font-size: 18px;
            color: #0f766e;
        }
        #moneyOutput {
            font-size: 22px;
            color: #0d9488;
            font-weight: 700;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            cursor: pointer;
            color: #115e59;
            font-size: 14px;
        }
        .checkbox-container input {
            width: 18px;
            height: 18px;
            accent-color: #0d9488;
        }
        .rate-info {
            font-size: 12px;
            color: #14b8a6;
            margin-top: 6px;
        }
        .disclaimer-info {
            font-size: 12px;
            color: #0d9488;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px dashed #99f6e4;
            line-height: 1.4;
        }
        /* עיצוב כפתור החזרה החדש */
        .back-button-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .back-button {
            background-color: transparent;
            color: #0f766e;
            border: 2px solid #0f766e;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-button:hover {
            background-color: #0f766e;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>מחשבון דמי הבראה</h2>
    
    <div class="form-group">
        <label for="years">הכנס ותק להבראה לפי התלוש</label>
        <input type="number" id="years" min="0" max="60" step="0.5" placeholder="הקלידו מספר שנות ותק..." oninput="calculateRecovery()">
        <div class="rate-info">* החישוב מבוסס על ערך יום הבראה של 511.6 ₪</div>
        
        <label class="checkbox-container" id="stateServiceContainer" style="display:none;">
            <input type="checkbox" id="isStateService" onchange="calculateRecovery()">
            <span>מעל 25 שנה בשירות המדינה או שירות צבאי*</span>
        </label>
    </div>

    <div class="form-group">
        <label for="jobPercentage">הכנס אחוז משרה בה הנך עובד </label>
        <div class="input-wrapper">
            <input type="number" id="jobPercentage" min="1" max="100" placeholder="למשל: 100, 75, 50..." oninput="calculateRecovery()">
            <span class="percent-symbol">%</span>
        </div>
    </div>

    <div id="result" class="result-box">
        <div class="result-line">זכאות מלאה לפי ותק: <strong id="daysOutput">0</strong> ימי הבראה.</div>
        <div class="result-line">סך הכל לתשלום (משוקלל משרה): <strong id="moneyOutput">0 ₪</strong></div>
        <div class="disclaimer-info">* הסכום הינו משוער בלבד, ובהתאם לחוזה סיום העסקה</div>
    </div>
</div>

<div class="back-button-container">
    <a href="https://zoom-online-activities-tax-authority.my.canva.site/dahkjrtbgse#page-5" class="back-button">
        <span>חזרה לאתר החברה</span> ↩
    </a>
</div>

<script>
function calculateRecovery() {
    const yearsInput = document.getElementById('years').value;
    const percentageInput = document.getElementById('jobPercentage').value;
    const isStateService = document.getElementById('isStateService').checked;
    const stateServiceContainer = document.getElementById('stateServiceContainer');
    
    const resultBox = document.getElementById('result');
    const daysOutput = document.getElementById('daysOutput');
    const moneyOutput = document.getElementById('moneyOutput');

    const dailyRate = 511.6;

    if (yearsInput === "" || yearsInput < 0) {
        resultBox.style.display = "none";
        return;
    }

    const years = parseFloat(yearsInput);
    
    let jobPercentage = parseFloat(percentageInput);
    if (isNaN(jobPercentage) || jobPercentage <= 0) {
        jobPercentage = 100;
    }

    let days = 0;

    if (years >= 25) {
        stateServiceContainer.style.display = "flex";
    } else {
        stateServiceContainer.style.display = "none";
        document.getElementById('isStateService').checked = false;
    }

    if (years >= 0 && years <= 3) {
        days = 7;
    } else if (years > 3 && years <= 10) {
        days = 9;
    } else if (years > 10 && years <= 15) {
        days = 10;
    } else if (years > 15 && years <= 19) {
        days = 11;
    } else if (years > 19 && years < 25) {
        days = 12;
    } else if (years >= 25) {
        if (isStateService) {
            days = 13;
        } else {
            days = 12;
        }
    }

    const totalMoney = days * dailyRate * (jobPercentage / 100);

    daysOutput.innerText = days;
    moneyOutput.innerText = totalMoney.toLocaleString('he-IL', { style: 'currency', currency: 'ILS', maximumFractionDigits: 0 });
    resultBox.style.display = "block";
}
</script>

</body>
</html>
